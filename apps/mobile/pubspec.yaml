name: finverse
description: FINVERSE — AI-powered personal finance. Android and iOS client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter Web validates the Cupertino icon font whenever the app includes
  # the Cupertino localization delegate. Declaring it explicitly prevents a
  # missing-font warning (and a blank icon if a Cupertino control is added).
  cupertino_icons: ^1.0.8
  # Acquires a user-selected local image only; OCR runs through the native
  # Vision/ML Kit channel and the image itself is never sent to the API.
  image_picker: ^1.2.3
  file_selector: ^1.0.3
  http: ^1.2.2
  intl: ^0.20.2
  # Browser bindings for the web build's Plaid Link implementation.
  web: ^1.1.0
  cryptography: ^2.9.0
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.2.0
  # Session tokens go in the platform keystore (Keychain / EncryptedSharedPreferences),
  # not shared preferences. A refresh token is a long-lived credential for
  # someone's bank data.
  flutter_secure_storage: ^10.3.1
  # Only a non-sensitive signed-out marker lives here so logout can complete
  # while the platform keystore is locked; session tokens never do.
  shared_preferences: ^2.5.3
  # Direct web implementation dependency for the targeted startup registration
  # in api/platform/shared_preferences_registration_web.dart. Flutter 3.44
  # omitted this endorsed implementation from the generated registrant here,
  # leaving SharedPreferencesAsync unset before the first frame.
  shared_preferences_web: ^2.4.3
  # Android WorkManager + iOS BGTaskScheduler. The task performs only a
  # credentialed, cursor-based bank refresh and is always best-effort: each OS
  # decides exactly when it has battery/network budget to run it.
  workmanager: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Directly declared because session-store tests install the package's
  # in-memory platform and inject controlled keystore failures.
  flutter_secure_storage_platform_interface: ^2.0.3

flutter:
  generate: true
  uses-material-design: true
