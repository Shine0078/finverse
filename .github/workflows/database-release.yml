name: Database release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the database secrets
        required: true
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type "release staging" or "release production"
        required: true
        type: string
      sha:
        description: Exact commit SHA that already passed CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: database-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_APP_URL: ${{ secrets.DATABASE_APP_URL }}
    steps:
      - name: Validate operator confirmation and secrets
        shell: bash
        env:
          EXPECTED_CONFIRMATION: release ${{ inputs.environment }}
          ACTUAL_CONFIRMATION: ${{ inputs.confirmation }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$ACTUAL_CONFIRMATION" = "$EXPECTED_CONFIRMATION"
          test -n "$DATABASE_URL"
          test -n "$DATABASE_APP_URL"
          if ! printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Release input must be an exact 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          CANDIDATE_SHA=$(printf '%s' "$CANDIDATE_SHA" | tr '[:upper:]' '[:lower:]')
          MATCH=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&status=completed&per_page=30" --jq '.workflow_runs | map(select(.name=="CI" and .conclusion=="success" and .head_sha=="'"$CANDIDATE_SHA"'" and (.head_branch=="main" or .head_branch=="master") and .head_repository.full_name=="'"$GITHUB_REPOSITORY"'")) | length')
          test "$MATCH" -gt 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Report migration plan
        run: npm run migrate:status --workspace @finverse/api

      - name: Apply forward-only migrations
        run: npm run migrate --workspace @finverse/api

      - name: Verify schema is current
        run: npm run migrate:verify --workspace @finverse/api

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Database release"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Commit: ${{ inputs.sha }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
