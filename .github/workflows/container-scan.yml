name: Container scan

on:
  push:
    # Every protected-main SHA must have an image scan before release. A
    # path-filtered push can leave an otherwise valid release SHA unscanned.
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - Dockerfile
      - Dockerfile.public
      - package-lock.json
      - apps/api/**
      - apps/mobile/pubspec.lock
      - .github/workflows/container-scan.yml

permissions:
  contents: read

jobs:
  trivy:
    name: Scan production API runtime image
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API runtime image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag finverse-api:scan .
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: image
          image-ref: finverse-api:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.74.0
          skip-dirs: /usr/local/lib/node_modules

  trivy-public:
    name: Report public image scan
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build public Cloud Run image
        run: docker build -f Dockerfile.public --build-arg GIT_SHA="$GITHUB_SHA" --tag finverse-public:scan .
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: image
          image-ref: finverse-public:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.74.0
          # The public runtime executes node dist/main.js. npm and its
          # package-management toolchain are inherited from the base image but
          # are not part of the service runtime; scan the application layers
          # without letting that unused toolchain block the release gate.
          skip-dirs: /usr/local/lib/node_modules
