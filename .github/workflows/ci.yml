name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API typecheck, tests and build
    runs-on: ubuntu-latest

    # CI gets a real Postgres from a service container rather than the
    # embedded-postgres harness used locally. Both set TEST_DATABASE_URL, so the
    # store contract suite cannot tell them apart — see apps/api/scripts/with-postgres.ts.
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: finverse
          POSTGRES_PASSWORD: finverse_dev_only
          POSTGRES_DB: finverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finverse -d finverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate release and operations scripts
        shell: bash
        run: |
          bash -n infra/scripts/*.sh
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- .; then
            echo "Unresolved merge-conflict marker found." >&2
            exit 1
          fi

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck --workspace @finverse/api

      # Runs first without a database, proving the in-memory path still stands
      # on its own — that is what a contributor without Postgres will run.
      - name: Tests (in-memory only)
        run: npm test

      # TEST_DATABASE_APP_URL is the restricted role the store contract and the
      # RLS suite connect as. The suite creates it; only the URL has to agree.
      - name: Tests (with Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://finverse:finverse_dev_only@localhost:5432/finverse
          TEST_DATABASE_APP_URL: postgresql://finverse_app:finverse_app_dev_only@localhost:5432/finverse

      - name: Migrations apply cleanly and are idempotent
        run: |
          npm run migrate --workspace @finverse/api
          npm run migrate --workspace @finverse/api
          npm run migrate:verify --workspace @finverse/api
        env:
          DATABASE_URL: postgresql://finverse:finverse_dev_only@localhost:5432/finverse
          DATABASE_APP_URL: postgresql://finverse_app:finverse_app_dev_only@localhost:5432/finverse

      - name: Install PostgreSQL client tools and age for backup drill
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client age

      - name: Back up and restore into an isolated drill database
        shell: pwsh
        env:
          DATABASE_URL: postgresql://finverse:finverse_dev_only@localhost:5432/finverse
          RESTORE_DATABASE_URL: postgresql://finverse:finverse_dev_only@localhost:5432/finverse_restore_test
        run: |
          psql $env:DATABASE_URL --command='CREATE DATABASE finverse_restore_test;'
          $identity = Join-Path $env:RUNNER_TEMP 'finverse-age-key.txt'
          age-keygen -o $identity | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate the backup-drill age identity.' }
          $recipientLine = Get-Content -LiteralPath $identity | Where-Object { $_ -like '# public key:*' }
          $recipient = $recipientLine -replace '^# public key:\s*', ''
          if ($recipient -notmatch '^age1[0-9a-z]+$') { throw 'Generated age recipient was invalid.' }
          $archive = ./infra/scripts/backup-postgres.ps1 `
            -DatabaseUrl $env:DATABASE_URL `
            -AgeRecipient $recipient `
            -Destination $env:RUNNER_TEMP
          ./infra/scripts/restore-drill-postgres.ps1 `
            -Archive $archive `
            -RestoreDatabaseUrl $env:RESTORE_DATABASE_URL `
            -AgeIdentity $identity

      - name: Authenticated PostgreSQL load smoke
        run: npm run load:smoke
        env:
          STORE: postgres
          MIGRATE_ON_BOOT: "false"
          DATABASE_URL: postgresql://finverse:finverse_dev_only@localhost:5432/finverse
          DATABASE_APP_URL: postgresql://finverse_app:finverse_app_dev_only@localhost:5432/finverse
          LOAD_TEST_DATABASE: "true"
          LOAD_REQUESTS: "160"
          LOAD_CONCURRENCY: "8"
          LOAD_P95_MS: "750"

      - run: npm run build

      - name: Build deployable API image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag finverse-api:ci .

  mobile:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Report outdated Flutter dependencies
        run: flutter pub outdated --mode=null-safety || true
      - run: flutter analyze
      - run: flutter test
      - name: Compile Android release target
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid
      - name: Compile PWA at the public /app/ mount
        run: |
          flutter build web --release --no-web-resources-cdn --base-href=/app/
          grep -F '<base href="/app/">' build/web/index.html
          grep -F '"useLocalCanvasKit":true' build/web/flutter_bootstrap.js
          grep -F "canvasKitBaseUrl: 'canvaskit/'" build/web/flutter_bootstrap.js
          ! grep -F 'serviceWorkerSettings: {' build/web/flutter_bootstrap.js

  ios:
    name: Compile native iOS target
    # This is intentionally a compile-only job. Signing, App Store
    # provisioning, and physical-device smoke tests require the owner's Apple
    # account and remain release-gate work rather than pull-request secrets.
    # workmanager_apple 0.9.10 references BGContinuedProcessingTask, which
    # exists only in the iOS 26 SDK shipped on macos-26 runners.
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.example.invalid
